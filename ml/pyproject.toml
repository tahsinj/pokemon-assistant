[project]
name = "stab-lab-ml"
version = "0.1.0"
description = "Training, evaluation and ONNX export for STAB Lab's models"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lightgbm>=4.5",
  "numpy>=2.0",
  "onnx>=1.17",
  "onnxmltools>=1.13",
  "onnxruntime>=1.20",
  "polars>=1.20",
  "scikit-learn>=1.6",
  "scipy>=1.14",
  "skl2onnx>=1.18",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
